# The workstation's shell helpers run on a freshly installed machine, where the
# failure modes are environmental — no network, a Docker daemon that has not
# started yet, a package that is not there. tests/ drives the REAL scripts against
# a sandboxed PATH of fakes (and, where what matters is what the operator SEES,
# under a pty), so those paths are exercised rather than assumed.
#
#   pytest            # from the repo root
[pytest]
testpaths = tests
addopts = -q
