set default=0
set timeout=20

insmod tga
background_image ($root)/boot/grub/splash.tga
set color_normal=light-gray/black
set color_highlight=white/blue
set menu_color_normal=light-gray/black
set menu_color_highlight=white/blue

LINUX_LIVE

# --- Sysible diagnostic / recovery entries -------------------------------------
# Selectable with the ARROW KEYS + ENTER only (no line editing, no Ctrl-X/F10) so
# they work on hardware where those GRUB shortcuts don't — e.g. a MacBook's
# internal keyboard. These reference the generic live kernel/initrd that
# live-build lays down at /live/vmlinuz and /live/initrd.img (same files the
# normal entry above boots), so they stay valid across kernel versions.
# Boot params mirror auto/config's --bootappend-live.

menuentry "Sysible Workstation (text mode — diagnostics, no desktop)" {
    linux  /live/vmlinuz boot=live components i915.enable_psr=0 i915.enable_dc=0 hostname=sysible-workstation username=sysible user-fullname=Sysible user-default-groups=sudo,kvm,libvirt,docker,wireshark,plugdev,netdev,video,audio 3 systemd.unit=multi-user.target
    initrd /live/initrd.img
}

menuentry "Sysible Workstation (extra Intel graphics fixes)" {
    linux  /live/vmlinuz boot=live components i915.enable_psr=0 i915.enable_dc=0 i915.enable_fbc=0 i915.enable_guc=0 hostname=sysible-workstation username=sysible user-fullname=Sysible user-default-groups=sudo,kvm,libvirt,docker,wireshark,plugdev,netdev,video,audio
    initrd /live/initrd.img
}

menuentry "Sysible Workstation (no boot splash)" {
    linux  /live/vmlinuz boot=live components i915.enable_psr=0 i915.enable_dc=0 plymouth.enable=0 hostname=sysible-workstation username=sysible user-fullname=Sysible user-default-groups=sudo,kvm,libvirt,docker,wireshark,plugdev,netdev,video,audio
    initrd /live/initrd.img
}

LINUX_INSTALL

MEMTEST
