# live-config must never be able to wedge the boot forever.
#
# live-config.service is Type=oneshot with DefaultDependencies=no and
# Before=basic.target, which means EVERYTHING waits on it — and systemd gives a
# Type=oneshot unit TimeoutStartSec=infinity by default. So one component that
# blocks (a debconf prompt nothing answers, a helper waiting on a bus that isn't
# up yet, a wget for a hook on a network that never comes up) leaves the machine
# sitting on
#
#     A start job is running for live-config.service (… / no limit)
#
# with no console, no greeter, and no way to read the log that would name the
# component — even the recovery entry can't get in, because multi-user.target is
# behind basic.target too. An unrecoverable hang.
#
# A finite timeout turns that into a bootable system: live-config is killed, the
# unit fails, and because basic.target only *Wants* it the boot continues to the
# desktop. systemd logs "live-config.service: start operation timed out", and
# /var/log/live/config.log ends on the component that stuck — which is the whole
# diagnosis, available from a running session instead of a photograph of a
# frozen screen.
#
# 180s is far more than a live boot needs (a normal run here is seconds; the
# slowest stock component, locale generation, is tens of seconds), so this
# cannot fire on a merely slow machine.
[Service]
TimeoutStartSec=180s
