# Sysible Workstation — optional-apps package tree (Calamares netinstall).
#
# One parent group with a checkbox per app. Everything is off by default and the
# group is non-critical: if the network is down or a vendor package fails, the
# install continues normally. Each package name below resolves against a vendor
# apt repository that sysible-release has already configured, so `apt install`
# Just Works without Sysible re-hosting any binaries.
- name: "Sysible platform apps (set up on the first boot)"
  description: >
    The Sysible platform itself. Nothing here is bundled in the ISO: cloning the
    repositories and building the containers needs a network, so ticking a box
    records the choice and the first networked boot does the work. Leaving them
    all unticked installs nothing, and you can still run `sudo install-sysible`
    later, or use the desktop launcher.
  hidden: false
  selected: false
  critical: false
  expanded: true
  subgroups:
    - name: "The whole platform, behind the SLOP gateway (recommended)"
      description: >
        Controller, SLEP and Connect behind the SLOP gateway, so everything is
        reached through one front door on one origin, addressed by path:
        /controller/, /slep/, /connect/. One sign-in covers all three. This
        supersedes the single-app choices below - picking it alongside them
        installs the gateway only, not a second standalone copy of each app.
      selected: false
      critical: false
      packages:
        - sysible-app-slop
    - name: "Sysible Controller only"
      description: >
        Sysible Controller CE alone, on its own listener, with no gateway in
        front of it. Its API is on port 9000 and its web console on 8800.
      selected: false
      critical: false
      packages:
        - sysible-app-controller
    - name: "Sysible SLEP only"
      description: >
        The Sysible Linux Engineering Platform alone, on its own listener, with
        no gateway in front of it.
      selected: false
      critical: false
      packages:
        - sysible-app-slep
    - name: "Sysible Connect only"
      description: >
        Sysible Connect alone, on its own listener, with no gateway in front of
        it.
      selected: false
      critical: false
      packages:
        - sysible-app-connect

- name: "Optional apps (installed from the official vendor)"
  description: >
    Proprietary or source-available tools Sysible can't bundle in the ISO for
    licensing reasons. Tick any you want — they're downloaded from the vendor's
    own apt repository during setup. Needs a network connection; leaving them
    unticked installs nothing. Open equivalents (VSCodium, OpenTofu, CherryTree)
    are already installed.
  hidden: false
  selected: false
  critical: false
  expanded: true
  subgroups:
    - name: "Obsidian — Markdown knowledge base (proprietary)"
      description: >
        Obsidian, from the official vendor release. It has no apt repository, so
        ticking this installs a tiny helper (sysible-obsidian-installer) that
        downloads and installs the latest official .deb from obsidian.md at setup
        time — nothing proprietary is re-hosted by Sysible. amd64 only; CherryTree
        (open source) is already installed and is the arm64 alternative.
      selected: false
      critical: false
      packages:
        - sysible-obsidian-installer
    - name: "Visual Studio Code — Microsoft build (proprietary)"
      description: >
        Microsoft's proprietary VS Code build, from packages.microsoft.com.
        VSCodium — the open-source (MIT) build of the same editor — is already
        installed.
      selected: false
      critical: false
      packages:
        - code
    - name: "Terraform (HashiCorp, BUSL 1.1)"
      description: >
        HashiCorp Terraform, from apt.releases.hashicorp.com. OpenTofu — the
        open (MPL) fork — is already installed and is command-compatible.
      selected: false
      critical: false
      packages:
        - terraform
    - name: "Packer (HashiCorp, BUSL 1.1)"
      description: >
        HashiCorp Packer image builder, from apt.releases.hashicorp.com. There
        is no mainstream open fork, so it isn't shipped by default.
      selected: false
      critical: false
      packages:
        - packer
    - name: "Vault (HashiCorp, BUSL 1.1)"
      description: >
        HashiCorp Vault — secrets management and data protection, from
        apt.releases.hashicorp.com.
      selected: false
      critical: false
      packages:
        - vault
    - name: "Consul (HashiCorp, BUSL 1.1)"
      description: >
        HashiCorp Consul — service discovery and service mesh, from
        apt.releases.hashicorp.com.
      selected: false
      critical: false
      packages:
        - consul
    - name: "Nomad (HashiCorp, BUSL 1.1)"
      description: >
        HashiCorp Nomad — workload orchestrator for containers, VMs and
        binaries, from apt.releases.hashicorp.com.
      selected: false
      critical: false
      packages:
        - nomad
    - name: "Boundary (HashiCorp, BUSL 1.1)"
      description: >
        HashiCorp Boundary — identity-aware access to remote hosts, from
        apt.releases.hashicorp.com.
      selected: false
      critical: false
      packages:
        - boundary
