# Sysible Workstation — optional-apps package tree (Calamares netinstall).
#
# One parent group with a checkbox per app. Everything is off by default and the
# group is non-critical: if the network is down or a vendor package fails, the
# install continues normally. Each package name below resolves against a vendor
# apt repository that sysible-release has already configured, so `apt install`
# Just Works without Sysible re-hosting any binaries.
# TWO GROUPS, NOT ONE. These used to be four ticks under a single "Sysible
# platform apps" parent, and Calamares' parent checkbox selects every child --
# which here meant the gateway stack AND three standalone copies of the very
# same apps. That is not installable: the gateway runs them under
# container_name sysible-controller / sysible-slep / sysible-connect, the same
# names a standalone install uses, so the second one collides on the name and
# on the port. Reported as "if I click the top it checks everything but it
# doesn't make sense to install everything".
#
# Split in two, ticking a parent means something in both: the first is the
# platform, the second is all three standalones. They are ALTERNATIVES -- pick
# from one or the other, not both.
- name: "Sysible platform (recommended)"
  description: >
    The whole platform behind the SLOP gateway: Controller, SLEP and Connect
    reached through one front door on one origin, addressed by path
    (/controller/, /slep/, /connect/), with one sign-in covering all three.
    Nothing here is bundled in the ISO -- cloning the repositories and building
    the containers needs a network, so ticking this records the choice and the
    first networked boot does the work. This is an alternative to the standalone
    apps below, not an addition to them.
  hidden: false
  selected: false
  critical: false
  expanded: true
  subgroups:
    - name: "SLOP gateway + Controller + SLEP + Connect"
      description: >
        One address, one login, all three apps behind it. If you want the
        platform, this is the only box you need.
      selected: false
      critical: false
      packages:
        - sysible-app-slop

- name: "Sysible standalone apps"
  description: >
    The same three apps, each on its own address, with no gateway in front and
    no shared sign-in. Tick this group for all three, or expand it and take
    just the ones you want. Do not combine these with the platform above: they
    are the same containers under the same names, so the two cannot run on one
    machine.
  hidden: false
  selected: false
  critical: false
  expanded: true
  subgroups:
    - name: "Sysible Controller"
      description: >
        Sysible Controller CE alone, on its own listener. Its API is on port
        9000 and its web console on 8800.
      selected: false
      critical: false
      packages:
        - sysible-app-controller
    - name: "Sysible SLEP"
      description: >
        The Sysible Linux Engineering Platform alone, on its own listener.
      selected: false
      critical: false
      packages:
        - sysible-app-slep
    - name: "Sysible Connect"
      description: >
        Sysible Connect alone, on its own listener.
      selected: false
      critical: false
      packages:
        - sysible-app-connect

- name: "Optional apps (installed from the official vendor)"
  description: >
    Proprietary or source-available tools Sysible can't bundle in the ISO for
    licensing reasons. Tick any you want — they're downloaded from the vendor's
    own apt repository during setup. Needs a network connection; leaving them
    unticked installs nothing. Open equivalents (VSCodium, OpenTofu, CherryTree)
    are already installed.
  hidden: false
  selected: false
  critical: false
  expanded: true
  subgroups:
    - name: "Obsidian — Markdown knowledge base (proprietary)"
      description: >
        Obsidian, from the official vendor release. It has no apt repository, so
        ticking this installs a tiny helper (sysible-obsidian-installer) that
        downloads and installs the latest official .deb from obsidian.md at setup
        time — nothing proprietary is re-hosted by Sysible. amd64 only; CherryTree
        (open source) is already installed and is the arm64 alternative.
      selected: false
      critical: false
      packages:
        - sysible-obsidian-installer
    - name: "Visual Studio Code — Microsoft build (proprietary)"
      description: >
        Microsoft's proprietary VS Code build, from packages.microsoft.com.
        VSCodium — the open-source (MIT) build of the same editor — is already
        installed.
      selected: false
      critical: false
      packages:
        - code
    - name: "Terraform (HashiCorp, BUSL 1.1)"
      description: >
        HashiCorp Terraform, from apt.releases.hashicorp.com. OpenTofu — the
        open (MPL) fork — is already installed and is command-compatible.
      selected: false
      critical: false
      packages:
        - terraform
    - name: "Packer (HashiCorp, BUSL 1.1)"
      description: >
        HashiCorp Packer image builder, from apt.releases.hashicorp.com. There
        is no mainstream open fork, so it isn't shipped by default.
      selected: false
      critical: false
      packages:
        - packer
    - name: "Vault (HashiCorp, BUSL 1.1)"
      description: >
        HashiCorp Vault — secrets management and data protection, from
        apt.releases.hashicorp.com.
      selected: false
      critical: false
      packages:
        - vault
    - name: "Consul (HashiCorp, BUSL 1.1)"
      description: >
        HashiCorp Consul — service discovery and service mesh, from
        apt.releases.hashicorp.com.
      selected: false
      critical: false
      packages:
        - consul
    - name: "Nomad (HashiCorp, BUSL 1.1)"
      description: >
        HashiCorp Nomad — workload orchestrator for containers, VMs and
        binaries, from apt.releases.hashicorp.com.
      selected: false
      critical: false
      packages:
        - nomad
    - name: "Boundary (HashiCorp, BUSL 1.1)"
      description: >
        HashiCorp Boundary — identity-aware access to remote hosts, from
        apt.releases.hashicorp.com.
      selected: false
      critical: false
      packages:
        - boundary
