---
# Sysible Linux — "Optional apps" installer page.
#
# These are proprietary or source-available (BUSL) tools that Sysible cannot
# legally bundle inside the ISO, but that you may still want. Ticking one
# installs it FROM THE OFFICIAL VENDOR apt repository (already configured on the
# system by the sysible-release package) during setup — nothing is re-hosted by
# Sysible.
#
# The page is entirely optional: everything is unticked by default, the whole
# step is `required: false`, and the group is non-critical, so a missing network
# or a failed download can never abort or roll back the installation.
label:
    sidebar: "Optional apps"
    title: "Optional apps"

# Read the package tree from a local file so the page renders even with no
# network. (Selected packages are still fetched from the vendor over the
# network at install time.)
groupsUrl: file:///etc/calamares/netinstall-optional-apps.yaml

# Never block the installer if the tree can't be read.
required: false
