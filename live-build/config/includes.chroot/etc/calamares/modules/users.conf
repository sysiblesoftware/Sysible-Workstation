---
# Sysible defaults for the Calamares install-to-disk flow.
# NOTE: 'docker' and 'wireshark' are intentionally NOT default groups — docker
# membership is passwordless-root-equivalent and wireshark grants raw packet
# capture. Users opt in explicitly (`sudo usermod -aG docker $USER`).
defaultGroups:
    - sudo
    - kvm
    - libvirt
    - plugdev
    - netdev
    - video
    - audio
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
# Leave root LOCKED on installed systems (Ubuntu-style): the admin created here
# is a sudoer and no separate root password is set — one fewer credential to
# manage/leak, and `sudo` is the only privilege path.
setRootPassword: false
doReusePassword: false
availableShells: /bin/bash
