---
# Sysible defaults for the Calamares install-to-disk flow.
defaultGroups:
    - sudo
    - kvm
    - libvirt
    - docker
    - wireshark
    - plugdev
    - netdev
    - video
    - audio
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
setRootPassword: true
doReusePassword: false
availableShells: /bin/bash

# Hostname — define it explicitly rather than inheriting the distro default, so
# the users page's "name for this computer" field is Sysible-controlled and the
# answer the operator types is written to the installed system (and /etc/hosts
# kept in sync). EtcFile = write /etc/hostname on the target.
setHostname: EtcFile
writeHostsFile: true
