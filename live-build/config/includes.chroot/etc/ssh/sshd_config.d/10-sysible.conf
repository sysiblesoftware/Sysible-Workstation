# Sysible Workstation SSH policy.
#
# SSH is ENABLED by default on Sysible (an engineering workstation is expected to
# be reachable over the network), and it accepts PASSWORD logins so you can get in
# with just your account password — no key setup required. fail2ban's ssh jail
# (shipped active) guards against brute force. Host keys are regenerated per machine
# on first boot (see the 9600 firstboot hook), not baked into the image.
#
# Override anything here with a later-sorting drop-in in this directory.

# Accept password and keyboard-interactive logins (as well as public keys).
PasswordAuthentication yes
KbdInteractiveAuthentication yes

# root may log in only with a key, never a password — log in as your own user and
# use sudo. Change to `yes` here if you really need direct root password login.
PermitRootLogin prohibit-password

# Never allow empty passwords, and keep the surface minimal.
PermitEmptyPasswords no
X11Forwarding no
