# Sysible Workstation — keep the display alive on Intel/Apple GPUs.
# i915 Panel Self Refresh (PSR) wedges the panel on many Intel laptops and every
# Broadwell-era MacBook we tested (screen freezes as the desktop starts; the CPU
# stays alive — a hard black/stuck display, not a crash). Disabling PSR keeps full
# GPU acceleration (unlike nomodeset, which blanks a Mac's panel entirely) and just
# turns off the one feature that hangs. Harmless on hardware that doesn't use PSR.
# Appended so it adds to, not replaces, whatever the installer set.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT i915.enable_psr=0 i915.enable_dc=0"
