# Sysible-branded GRUB menu. Sourced by grub-mkconfig after /etc/default/grub,
# so it applies on the installed system (Calamares runs update-grub on the
# target, which reads this drop-in) without editing the main grub file.
GRUB_THEME="/boot/grub/themes/sysible/theme.txt"
# Prefer 1024x768 — the resolution firmware/VM GOP actually gives the GRUB menu
# (native high-res only arrives once the kernel loads). The theme's logo is sized
# for this, so the installed menu renders at the same modest size as the live ISO
# menu instead of being over- or under-sized at some other resolution.
GRUB_GFXMODE="1024x768,1280x720,auto"
GRUB_GFXPAYLOAD_LINUX="keep"
GRUB_TERMINAL_OUTPUT="gfxterm"
# Menu entries read "Sysible Linux" (not the auto-derived "Sysible"). The system
# hook also patches /etc/grub.d/10_linux so the title is "<distributor> Linux"
# rather than the hard-coded "<distributor> GNU/Linux" (the same special-casing
# Ubuntu does for its own entries).
GRUB_DISTRIBUTOR="Sysible"
