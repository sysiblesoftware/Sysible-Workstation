<?xml version="1.0" encoding="UTF-8"?>
<!-- Sysible Workstation mark — SES rebrand. Dark tile + green ring + a terminal
     WINDOW + short green underline.
     The glyph used to be the Sora "S", which Sysible Server also used: the two
     product marks were byte-identical apart from one word in this comment, so
     Workstation and Server were distinguishable only by the wordmark set beside
     them. The tile, the ring, the green and the underline are unchanged, so the
     marks still read as one family; only the glyph inside tells them apart.
     Workstation is the one a person sits in front of — VSCodium, SysTerm, a
     desktop — so it gets a window with a prompt caret in it. Font-free vectors,
     as before. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs><linearGradient id="t" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#18202c"/><stop offset="1" stop-color="#0b0e15"/></linearGradient></defs>
  <rect x="6" y="6" width="116" height="116" rx="27" fill="url(#t)"/>
  <rect x="6" y="6" width="116" height="116" rx="27" fill="none" stroke="#6ddb73" stroke-width="3.5"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="30" y="31" width="68" height="53" rx="8" stroke="#eceff3" stroke-width="5.8"/>
    <path d="M30 47.6 H98" stroke="#eceff3" stroke-width="5.8"/>
    <path d="M43.8 60.9 L52.9 68 L43.8 75.1" stroke="#6ddb73" stroke-width="5.3"/>
    <path d="M60 75.6 H82.7" stroke="#6ddb73" stroke-width="5.3"/>
  </g>
  <circle cx="39.3" cy="39.3" r="3.4" fill="#6ddb73"/>
  <circle cx="50.6" cy="39.3" r="3.4" fill="#6ddb73"/>
  <rect x="43.2" y="94" width="41.5" height="5" rx="2" fill="#6ddb73"/>
</svg>
