# Render the background at 800x600 (crisp on VMs/most firmware) so splash.png,
# authored at 800x600, isn't upscaled and soft.
menu resolution 800 600
menu hshift 0
menu width 82

# Debian's stdmenu.cfg sets its OWN vshift/rows/title-rows, so it must be
# included FIRST and our geometry set AFTER it — otherwise the include clobbers
# our values and the menu renders up over the artwork (the "garbled" overlap).
include stdmenu.cfg

# The Sysible logo + wordmark own the top ~44% of splash.png (art ends ~y=265 of
# 600). Keep the boot entries firmly in the clear lower band; no menu title (the
# wordmark already reads SYSIBLE WORKSTATION, so a title just double-prints over it).
menu vshift 25
menu rows 6
menu tabmsgrow 35
menu cmdlinerow 35
menu helpmsgrow 36
menu helpmsgendrow 37

include live.cfg
include install.cfg
menu end
