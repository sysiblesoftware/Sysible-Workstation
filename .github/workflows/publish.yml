name: Publish

on:
  push:
    branches: [main]        # -> sysible-dev
    tags: ['v*']            # -> sysible-stable

jobs:
  publish:
    runs-on: ubuntu-latest
    # Never run on forks; only publish from the canonical repo.
    if: github.repository == 'sysiblesoftware/Sysible-Linux'
    env:
      # aptly publishes to a local dir; a later step `aws s3 sync`s it to R2.
      # (aptly's native S3 publish emits an x-amz-acl header R2 rejects with 501.)
      SYSIBLE_APTLY_ENDPOINT: "filesystem:local:"
      SYSIBLE_GPG_KEY: maintainers@sysible.com
      # Cloudflare R2 (S3-compatible). AWS_* are your R2 API-token credentials;
      # region is always "auto" for R2. R2_ACCOUNT_ID is a repo *variable* (not a
      # secret) — your Cloudflare account id — used to build the S3 endpoint host.
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2_ENDPOINT is resolved from R2_ACCOUNT_ID in the "Resolve R2 endpoint"
      # step below — it tolerates either a bare account id or a full endpoint URL.
      STATE_URI: s3://sysible-apt/_aptly-db
    steps:
      - uses: actions/checkout@v4

      - name: Preflight — required secrets
        run: |
          if [ -z "${{ secrets.SYSIBLE_GPG_PRIVATE_KEY }}" ] || [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ vars.R2_ACCOUNT_ID }}" ]; then
            echo "::error::Set secrets SYSIBLE_GPG_PRIVATE_KEY + AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY (your Cloudflare R2 token) and the repo variable R2_ACCOUNT_ID before publishing."
            exit 1
          fi

      - name: Resolve R2 endpoint
        run: |
          # Accept either the bare Cloudflare account id or a full endpoint URL
          # in the R2_ACCOUNT_ID variable, and normalise to the S3 endpoint host.
          acct="${{ vars.R2_ACCOUNT_ID }}"
          acct="${acct#http://}"; acct="${acct#https://}"
          acct="${acct%%.r2.cloudflarestorage.com*}"
          acct="${acct%%/*}"
          echo "R2_ENDPOINT=https://${acct}.r2.cloudflarestorage.com" >> "$GITHUB_ENV"
          echo "Using R2 endpoint host: ${acct}.r2.cloudflarestorage.com"

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python python3-all python3-setuptools \
            pybuild-plugin-pyproject aptly ca-certificates gnupg curl unzip
          # awscli was dropped from Ubuntu 24.04's archive; install AWS CLI v2
          # from AWS directly (it speaks the S3 API we use against Cloudflare R2).
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update
          aws --version

      - name: Import signing key
        run: |
          echo "${{ secrets.SYSIBLE_GPG_PRIVATE_KEY }}" | gpg --batch --import
          # The secret must contain the exact key we sign with, and whose public
          # half is the committed keyring — otherwise clients can't verify.
          if ! gpg --list-secret-keys "$SYSIBLE_GPG_KEY" >/dev/null 2>&1; then
            echo "::error::SYSIBLE_GPG_PRIVATE_KEY does not contain $SYSIBLE_GPG_KEY. Update the secret with: gpg --armor --export-secret-keys maintainers@sysible.com"
            exit 1
          fi

      - name: aptly config
        run: |
          # Repoint the DB rootDir (/var/lib/aptly needs root) and the filesystem
          # publish dir at writable paths under $HOME. The __R2_ENDPOINT__ sub is
          # harmless (the S3 publish endpoint is unused now — we sync via awscli).
          sed -e "s#__R2_ENDPOINT__#${R2_ENDPOINT#https://}#" \
              -e "s#/var/lib/aptly#$HOME/.aptly#" \
              -e "s#/srv/repo.sysible.com/apt#$HOME/aptly-public#" \
              scripts/aptly.conf.sample > "$HOME/.aptly.conf"

      - name: Restore aptly database
        run: aws s3 sync --endpoint-url "$R2_ENDPOINT" "$STATE_URI" "$HOME/.aptly" || echo "no prior aptly state (first run)"

      - name: Build all packages
        run: ./scripts/build-all.sh

      - name: Select suite
        id: suite
        run: |
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            echo "name=sysible-stable" >> "$GITHUB_OUTPUT"
          else
            echo "name=sysible-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        run: ./scripts/publish-repo.sh ${{ steps.suite.outputs.name }}

      - name: Sync repo to R2
        run: |
          # Upload the aptly-generated tree to the bucket's apt/ prefix. aws s3
          # sync sends no x-amz-acl header, so R2 accepts it (unlike aptly's S3
          # publish). --delete keeps R2 an exact mirror of the fresh publish.
          aws s3 sync "$HOME/aptly-public/" "s3://sysible-apt/apt/" \
            --endpoint-url "$R2_ENDPOINT" --delete --no-progress

      - name: Persist aptly database
        run: aws s3 sync --endpoint-url "$R2_ENDPOINT" "$HOME/.aptly" "$STATE_URI"
