name: Publish

on:
  push:
    branches: [main]        # -> sysible-dev
    tags: ['v*']            # -> sysible-stable

jobs:
  publish:
    runs-on: ubuntu-latest
    # Never run on forks; only publish from the canonical repo.
    if: github.repository == 'sysiblesoftware/Sysible-Linux'
    env:
      SYSIBLE_APTLY_ENDPOINT: "s3:sysible:"
      SYSIBLE_GPG_KEY: maintainers@sysible.com
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      STATE_URI: s3://sysible-apt/_aptly-db
    steps:
      - uses: actions/checkout@v4

      - name: Preflight — required secrets
        run: |
          if [ -z "${{ secrets.SYSIBLE_GPG_PRIVATE_KEY }}" ] || [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "::error::Set repo secrets SYSIBLE_GPG_PRIVATE_KEY and AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY before publishing."
            exit 1
          fi

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python python3-all python3-setuptools \
            pybuild-plugin-pyproject aptly awscli ca-certificates gnupg

      - name: Import signing key
        run: |
          echo "${{ secrets.SYSIBLE_GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: aptly config
        run: cp scripts/aptly.conf.sample "$HOME/.aptly.conf"

      - name: Restore aptly database
        run: aws s3 sync "$STATE_URI" "$HOME/.aptly" || echo "no prior aptly state (first run)"

      - name: Build all packages
        run: ./scripts/build-all.sh

      - name: Select suite
        id: suite
        run: |
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            echo "name=sysible-stable" >> "$GITHUB_OUTPUT"
          else
            echo "name=sysible-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        run: ./scripts/publish-repo.sh ${{ steps.suite.outputs.name }}

      - name: Persist aptly database
        run: aws s3 sync "$HOME/.aptly" "$STATE_URI"
