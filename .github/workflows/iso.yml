name: ISO

# Build the COMPLETE Sysible Workstation ISO on GitHub's runners, whose network is not
# HTTPS-inspected, so every vendor tool (Docker, Kubernetes, Terraform, cloud
# CLIs, VS Code) bakes in. Download the finished .iso from the run's Artifacts,
# or — on a version tag (v*) — from the published GitHub Release.
on:
  workflow_dispatch:          # run it manually from the Actions tab
    inputs:
      arch:
        description: 'Target architecture'
        type: choice
        options: [amd64, arm64]
        default: amd64
      release:
        description: 'Publish a GitHub Release (split ISO + checksums)'
        type: boolean
        default: false
      tag:
        description: 'Release tag to create/use (only when release=true)'
        type: string
        default: v0.1.0
  push:
    tags: ['v*']              # and on release tags (amd64)

permissions:
  contents: write             # needed to create the Release on a tag

jobs:
  iso:
    # arm64 builds run on a native ARM runner (free for public repos); amd64 and
    # tag pushes use the standard x86 runner.
    runs-on: ${{ (github.event.inputs.arch == 'arm64') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 120
    container:
      image: debian:bookworm
      options: --privileged   # live-build needs mount/loop/chroot
    env:
      SYSIBLE_ARCH: ${{ github.event.inputs.arch || 'amd64' }}
    steps:
      - name: Prereqs for checkout
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      # Fail FAST (seconds, not 35 minutes) if any logo asset drifted from the
      # canonical mark — e.g. the mark was changed but the boot/GRUB/Plymouth PNGs
      # weren't regenerated. Pure sha256 check, no rendering, so it needs no extra
      # deps and can't false-positive on toolchain differences.
      - name: Verify branding is in sync
        run: sh scripts/verify-branding.sh

      - name: Build the ISO
        run: |
          cd live-build
          ./build.sh

      - name: Name the ISO
        run: |
          cd live-build
          echo "ISO files produced by the build:"; ls -1 *.iso || true
          out="sysible-workstation-${SYSIBLE_ARCH}.iso"
          # Pick the real image (iso-hybrid emits *.hybrid.iso), preferring one
          # that isn't already the target name, and rename it to the branded name.
          iso=$(ls *.hybrid.iso 2>/dev/null | head -1)
          [ -n "$iso" ] || iso=$(ls *.iso 2>/dev/null | grep -vx "$out" | head -1)
          [ -n "$iso" ] || iso="$out"
          [ "$iso" = "$out" ] || mv -v "$iso" "$out"
          # Delete any OTHER stray .iso so the upload glob can only ever grab the
          # single branded image — never a generic 'live-image-*'/leftover name.
          for f in *.iso; do [ "$f" = "$out" ] || rm -vf "$f"; done
          # Assert the branded ISO is the one and only .iso we ship.
          left=$(ls -1 *.iso 2>/dev/null)
          if [ "$left" != "$out" ]; then
            echo "::error::expected exactly one ISO named '$out', got: $left" >&2
            exit 1
          fi
          echo "Final ISO: $out"

      - name: Show result
        run: ls -lh live-build/*.iso

      - name: Upload ISO (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: sysible-workstation-${{ env.SYSIBLE_ARCH }}
          path: live-build/*.iso
          if-no-files-found: error
          compression-level: 0

      # ---- release-only steps (tag push, or a dispatch with release=true) --
      - name: Split ISO for release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        run: |
          set -e
          apt-get install -y --no-install-recommends coreutils
          A="${SYSIBLE_ARCH:-amd64}"     # arch-suffix shared-name files
          mkdir -p release
          ISO=$(ls live-build/*.iso | head -1)
          BASE=$(basename "$ISO")
          cd release
          # Full-image checksum, for verifying AFTER reassembly.
          sha256sum -b "../$ISO" | sed "s| .*| *$BASE|" > "SHA256SUMS.$A"
          # GitHub release assets cap at 2 GiB, so split into 1900 MiB parts.
          split -b 1900M -d --additional-suffix=.part "../$ISO" "$BASE."
          # Per-part checksums, for verifying the downloads BEFORE reassembly.
          sha256sum -b "$BASE".*.part > "SHA256SUMS.$A.parts"
          cat > "REASSEMBLE.$A.md" <<EOF
          # Sysible Workstation ($A) — reassemble the ISO

          The ISO is ~3.4 GB, over GitHub's 2 GB per-file release limit, so it is
          split into \`$BASE.*.part\` pieces.

          Download every \`$BASE.*.part\`, plus \`SHA256SUMS.$A\`,
          \`SHA256SUMS.$A.parts\` and their \`.gpg\` signatures, into one folder.

          First verify AUTHENTICITY with the Sysible release key (fingerprint
          published at https://sysible.com/security), then the checksums:

          \`\`\`sh
          gpg --verify SHA256SUMS.$A.parts.gpg SHA256SUMS.$A.parts  # authenticity
          sha256sum -c SHA256SUMS.$A.parts     # verify the downloaded parts
          cat $BASE.*.part > $BASE             # reassemble
          gpg --verify SHA256SUMS.$A.gpg SHA256SUMS.$A              # authenticity
          sha256sum -c SHA256SUMS.$A           # verify the whole ISO
          \`\`\`

          Then write \`$BASE\` to a USB stick (\`dd\`, Etcher, Rufus) and boot it.
          The live session logs in automatically; the installer creates your own
          account and password (no default login ships in the image).
          EOF
          ls -lh

      # Sign the checksum manifests with the Sysible release key so the download
      # has an AUTHENTICITY anchor, not just an integrity check. Without this,
      # anyone able to alter the release assets swaps the ISO AND the checksums
      # together and `sha256sum -c` still passes. The `SHA256SUMS.*` glob in the
      # publish step already picks up the resulting `.gpg` files.
      # NOTE: ideally the release key is applied OFFLINE (hardware token) rather
      # than injected into this privileged build container; this in-CI signing is
      # the minimum bar. Fails closed if the key is absent.
      - name: Sign the checksum manifests
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        env:
          SYSIBLE_GPG_PRIVATE_KEY: ${{ secrets.SYSIBLE_GPG_PRIVATE_KEY }}
        run: |
          set -e
          if [ -z "$SYSIBLE_GPG_PRIVATE_KEY" ]; then
            echo "::error::SYSIBLE_GPG_PRIVATE_KEY is not set — a public release must ship signed checksums."
            exit 1
          fi
          apt-get install -y --no-install-recommends gnupg
          GNUPGHOME="$(mktemp -d)"; export GNUPGHOME; chmod 700 "$GNUPGHOME"
          printf '%s' "$SYSIBLE_GPG_PRIVATE_KEY" | gpg --batch --import
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/{print $5; exit}')
          cd release
          for f in SHA256SUMS.*; do
            case "$f" in *.gpg) continue ;; esac
            gpg --batch --yes --local-user "$KEYID" --armor --detach-sign -o "$f.gpg" "$f"
            gpg --batch --verify "$f.gpg" "$f"
          done
          gpgconf --kill all 2>/dev/null || true
          rm -rf "$GNUPGHOME"
          ls -l

      # SECURITY TODO: pin this third-party action to a full commit SHA (it holds
      # contents:write). It is left at the mutable @v2 tag only because the SHA
      # must be resolved and reviewed on a trusted network — do that before the
      # public release: `uses: softprops/action-gh-release@<40-char-sha>  # v2.x`.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          # On a tag push, use that tag; on a dispatch, create/use inputs.tag
          # at the checked-out commit (action creates the tag if it's new).
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          name: Sysible Workstation ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          files: |
            release/*.part
            release/SHA256SUMS.*
            release/REASSEMBLE.*.md
          # A fixed, clean body. amd64 and arm64 publish to the same tag, so keep
          # append_body off and don't auto-generate notes (that appended a
          # duplicate changelog line on every publish).
          generate_release_notes: false
          append_body: false
          body: |
            **Sysible Workstation 1.0.2 “Ignition”** — the engineering & automation workstation.

            A live Debian-stable image with the whole toolchain baked in: containers,
            Kubernetes, infrastructure-as-code, cloud CLIs, VSCodium and the SysTerm
            terminal — plus the Sysible Controller CE installer.

            **New in 1.0.2:** the installer now has an **Optional apps** page. The ISO
            ships only redistributable software (VSCodium, OpenTofu, CherryTree), but if
            you want the proprietary/BUSL originals — VS Code, Terraform, Packer — you
            can tick them during setup and they're installed straight from the official
            vendor apt repositories. Obsidian (no apt repo, amd64-only) has a one-command
            helper, `sysible-install-obsidian`. See `THIRD-PARTY-LICENSES.md`.

            ### Downloads (amd64 & arm64)
            The ISO is ~3.4 GB, over GitHub's 2 GB per-file limit, so each build ships
            as numbered `*.part` files. Download every `*.part` for your architecture
            plus the two `SHA256SUMS.<arch>*` files, then reassemble:

            ```sh
            gpg --verify SHA256SUMS.<arch>.parts.gpg SHA256SUMS.<arch>.parts  # authenticity
            sha256sum -c SHA256SUMS.<arch>.parts   # verify the parts
            cat sysible-workstation-<arch>.iso.*.part > sysible-workstation-<arch>.iso
            gpg --verify SHA256SUMS.<arch>.gpg SHA256SUMS.<arch>              # authenticity
            sha256sum -c SHA256SUMS.<arch>          # verify the whole ISO
            ```

            Verify authenticity with the Sysible release key (fingerprint at
            https://sysible.com/security) before trusting the checksums. See
            `REASSEMBLE.<arch>.md` for exact commands. The live session logs in
            automatically; the installer creates your own account — no default
            login ships in the image.
          fail_on_unmatched_files: true

      # Poke the website so its download page updates to this release right away.
      # Optional: set the WEBSITE_DISPATCH_TOKEN secret (a fine-grained PAT with
      # "Contents: write" on sysiblesoftware/sysible-website) to enable it. If the
      # secret is absent this is a no-op — the website's own 6-hourly sync still
      # catches the new release.
      - name: Notify website of new release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        env:
          WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "${WEBSITE_DISPATCH_TOKEN:-}" ]; then
            echo "WEBSITE_DISPATCH_TOKEN not set — skipping. The website syncs itself every 6h."
            exit 0
          fi
          curl -sSL --fail -X POST \
            -H "Authorization: Bearer $WEBSITE_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/sysiblesoftware/sysible-website/dispatches \
            -d '{"event_type":"iso-released"}'
